# /docker-compose.yml
services:
  # Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER: laravel
        UID: 1000
    image: livewire-app
    container_name: livewire-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - app-network
    depends_on:
      - db
      - redis

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: livewire-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - app-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: livewire-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: livewire-redis
    restart: unless-stopped
    networks:
      - app-network

# Networks for communication between containers
networks:
  app-network:
    driver: bridge

# Volumes for persistent data
volumes:
  dbdata:
    driver: local
